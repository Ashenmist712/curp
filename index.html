<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="public/css/b5.css">
    <link rel="stylesheet" href="main.css">
    <script src="public/js/b5.js"></script>
    <script src="public/js/poper.js"></script>
    <script src="public/js/leader.js"></script>
    <title>Generacion del CURP</title>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-12 text-center mb-3">
                <h1>Generacion del CURP</h1>
                <hr>
            </div>
            <h4 class="text-center">Datos Peronales</h4>
            <div class="col-md-6">
                <form id="formulario">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre">
                    </div>
                    <div class="mb-3">
                        <label for="apellidoPaterno" class="form-label">Apellido Paterno</label>
                        <input type="text" class="form-control" id="apellidoPaterno">
                    </div>
                    <div class="mb-3">
                        <label for="apellidoMaterno" class="form-label">Apellido Materno</label>
                        <input type="text" class="form-control" id="apellidoMaterno">
                    </div>
                    <div class="mb-3">
                        <label for="fechaNacimiento" class="form-label">Fecha de Nacimiento</label>
                        <input type="date" class="form-control" id="fechaNacimiento">
                    </div>
                    <div class="mb-3">
                        <label for="sexo" class="form-label">Sexo</label>
                        <select class="form-select" id="sexo">
                            <option value="">Seleccione</option>
                            <option value="H">Hombre</option>
                            <option value="M">Mujer</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="ciudadNacimiento" class="form-label">Entidad de Nacimiento</label>
                        <select class="form-select" id="ciudadNacimiento">
                            <option value="">Seleccione una entidad</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Generar CURP</button>
                </form>
            </div>
        </div>
    </div>
    <script src="public/js/ciudades.js"></script>
    <script src="public/js/index.js"></script>
</body>
</html>
